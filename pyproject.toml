[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunoauxtool"
version = "1.5.4"
description = "SunoAuxTool：Suno/海绵音乐/网易天音等 AI 音乐工具的前期+后期处理工具箱（生成/谱面/互转 + 下载/转码/DSP/视频/音质增强）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SunoAuxTool Team" }]
keywords = ["music", "midi", "suno", "music21", "fluidsynth", "video", "audiosr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer==0.27.1",
    "music21==10.5.0",
    "pretty-midi==0.2.11.post0",
    "midi2audio==0.1.1",
    "soundfile==0.14.0",
    "numpy==2.5.1",
    "scipy==1.18.0",  # R6 DSP：resample_poly + EBU R128 K 加权（loudness.py）
    "tomli-w==1.2.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/li589/SunoAuxTool"
Repository = "https://github.com/li589/SunoAuxTool"
Changelog = "https://github.com/li589/SunoAuxTool/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mp3 = ["lameenc==1.8.4"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.11.0"]

[project.scripts]
sunoaux = "sunoauxtool.aggregate:app"        # 聚合入口（pre/post，R3）
sunoauxtool = "sunoauxtool.cli:app"
downloadhelper = "sunoauxtool.download.cli:app"
# 旧入口别名 smartnotegen / videomaker 已于 1.4.5 移除（1.4.0 最后公告）。

[tool.setuptools.packages.find]
where = ["src"]
# versatile_audio_super_resolution 是 src/ 下的 AudioSR 上游克隆（自带内嵌 .git），
# R5 入库时清理后再收编；当前阶段必须排除，否则打包/嵌入仓库告警。
exclude = ["versatile_audio_super_resolution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 保留全部临时目录（沙箱下回收站不可用，禁止 pytest 安全删除临时目录）
tmp_path_retention_policy = "all"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["sunoauxtool"]
# 二期起 AI 模块测试计入覆盖率（AI 适配器顶部零 torch import；推理路径由 mock 测试覆盖）。
# 因此不再 omit src/sunoauxtool/ai/*。
omit = ["src/sunoauxtool/__main__.py"]

[tool.coverage.report]
fail_under = 87

[tool.ruff]
line-length = 100
target-version = "py312"
# VASR（AudioSR 上游 fork）在 R5 入库前先排除 lint；入库时按计划清理 153 处问题
extend-exclude = ["src/versatile_audio_super_resolution"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src/sunoauxtool"]
exclude = ["venv", "tests"]
# 不强制严格模式，仅作静态检查辅助
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
